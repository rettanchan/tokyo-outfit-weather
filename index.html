<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f3e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="東京の服装">
    <meta name="description" content="東京の今日と明日の天気を見ながら、レディースファッションの服装アドバイスを確認できるiPhone向けPWAです。">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <title>東京の天気と服装</title>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <header class="topbar">
          <div><p class="eyebrow">Tokyo Weather</p><h1>天気と服装</h1></div>
          <button class="icon-button" id="refresh" type="button" aria-label="更新">↻</button>
        </header>
        <div class="weather-main">
          <div><p class="date" id="date">読み込み中</p><p class="condition" id="condition">--</p></div>
          <div class="temp"><span id="temp">--</span><small>°</small></div>
        </div>
        <p class="summary" id="summary">今日と明日の予報を取得しています。</p>
        <div class="tabs" role="tablist" aria-label="表示する日">
          <button class="tab active" type="button" data-day="0" aria-selected="true">今日</button>
          <button class="tab" type="button" data-day="1" aria-selected="false">明日</button>
        </div>
        <div class="metrics">
          <div><span>最高 / 最低</span><strong id="range">--</strong></div>
          <div><span>降水</span><strong id="rain">--</strong></div>
          <div><span>体感</span><strong id="feel">--</strong></div>
          <div><span>風</span><strong id="wind">--</strong></div>
        </div>
      </section>
      <section class="panel">
        <div class="section-heading"><p class="eyebrow">Ladies Outfit</p><h2>レディース服装アドバイス</h2></div>
        <article class="advice-card"><h3 id="advice-title">提案を作成中</h3><p id="advice-copy">天気に合わせて服装を提案します。</p><ul id="items"></ul></article>
        <div class="note-grid"><article><h3 id="rain-title">雨対策</h3><p id="rain-copy">確認中</p></article><article><h3>一言メモ</h3><p id="extra-copy">確認中</p></article></div>
      </section>
      <section class="panel timeline"><div class="section-heading"><p class="eyebrow">Day Flow</p><h2>時間帯の目安</h2></div><ol id="timeline"></ol></section>
      <footer><p id="updated">Open-Meteoから予報を取得します</p></footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
